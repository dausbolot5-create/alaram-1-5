name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Capacitor build and sync
      run: |
        npm install
        npm run build
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle (Capacitor)
      run: |
        cd android
        chmod +x gradlew || true
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: examping-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Rename APK
      run: cp android/app/build/outputs/apk/debug/app-debug.apk examping-release.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: examping-release.apk
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Examping APK Release v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
